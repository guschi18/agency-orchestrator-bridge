name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Die Bridge ist Windows-Software (PowerShell-Startscripts, Laufwerkspfade,
    # PATHEXT-Suche): CI läuft auf der Zielplattform, nicht auf Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        working-directory: bridge
        run: npm test
